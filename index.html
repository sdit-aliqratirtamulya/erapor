<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Rapor Input Nilai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3498db;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-5 rounded-lg flex items-center gap-3 shadow-lg">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div>
            <span class="text-gray-700 font-semibold">Memproses data...</span>
        </div>
    </div>

    <!-- Container Utama -->
    <div class="max-w-6xl mx-auto p-4">

        <!-- VIEW 1: FORM LOGIN -->
        <div id="view-login" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">e-Rapor Login</h2>
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                    <input type="text" id="username" required autocomplete="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" required autocomplete="current-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">Masuk</button>
            </form>
        </div>

        <!-- VIEW 2: DASHBOARD & INPUT NILAI -->
        <div id="view-dashboard" class="hidden">
            <!-- Header -->
            <div class="bg-white p-4 rounded-lg shadow-sm flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Penginputan Nilai Rapor</h1>
                    <p class="text-sm text-gray-500">Wali Kelas: <span id="user-nama" class="font-semibold text-blue-600"></span> | Rombel: <span id="user-rombel" class="font-bold text-blue-600"></span></p>
                </div>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-red-600 transition">Keluar</button>
            </div>

            <!-- Filter Mata Pelajaran -->
            <div class="bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-wrap gap-4 items-center">
                <label class="font-semibold text-gray-700">Pilih Mata Pelajaran:</label>
                <select id="select-mapel" onchange="loadNilai()" class="border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <!-- Dynamic Option -->
                </select>
            </div>

            <!-- Form Table Matrix e-Rapor -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <form id="form-nilai" onsubmit="handleSaveNilai(event)">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 border-b text-sm text-gray-600">
                                    <th class="p-3">No</th>
                                    <th class="p-3">NISN</th>
                                    <th class="p-3">Nama Siswa</th>
                                    <th class="p-3 text-center">TP 1</th>
                                    <th class="p-3 text-center">TP 2</th>
                                    <th class="p-3 text-center">TP 3</th>
                                    <th class="p-3 text-center">STS</th>
                                    <th class="p-3 text-center">SAS</th>
                                    <th class="p-3 text-center bg-blue-50">Rata-Rata</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Data Siswa Rendered Here -->
                            </tbody>
                        </table>
                    </div>

                    <div class="p-4 bg-gray-50 border-t flex justify-end">
                        <button type="submit" class="bg-green-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-green-700 transition">
                            Simpan Semua Nilai
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzSkVz-kQ-oV9tJSdlLIVp-ZpyM1e3rTBjAtAResso88WMlWoEF7ynq7vzWSCOlkknj/exec";

        let currentSession = null;
        let siswaData = [];

        function showLoading(show) {
            document.getElementById("loading").classList.toggle("hidden", !show);
        }

        async function apiCall(data) {
            showLoading(true);
            try {
                // Perbaikan: gunakan redirect: "follow" dan penanganan Content-Type untuk Apps Script
                const response = await fetch(API_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(data),
                    redirect: "follow"
                });

                if (!response.ok) {
                    throw new Error("HTTP error! status: " + response.status);
                }

                const result = await response.json();
                showLoading(false);
                return result;
            } catch (err) {
                showLoading(false);
                alert("Terjadi kesalahan koneksi! Periksa koneksi internet atau hak akses Apps Script.");
                console.error("API Call Error:", err);
                return null;
            }
        }

        // --- AUTH SYSTEM ---
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            const res = await apiCall({ action: "login", username, password });

            if (res && res.success) {
                currentSession = res.data;
                document.getElementById("user-nama").innerText = currentSession.nama;
                document.getElementById("user-rombel").innerText = currentSession.rombel;
                
                document.getElementById("view-login").classList.add("hidden");
                document.getElementById("view-dashboard").classList.remove("hidden");

                await initDashboard();
            } else if (res) {
                alert(res.message || "Login gagal!");
            }
        }

        function logout() {
            currentSession = null;
            document.getElementById("view-dashboard").classList.add("hidden");
            document.getElementById("view-login").classList.remove("hidden");
            document.getElementById("form-login").reset();
        }

        // --- DASHBOARD SYSTEM ---
        async function initDashboard() {
            const res = await apiCall({ action: "getSiswaAndMapel", rombel: currentSession.rombel });
            
            if (res && res.success) {
                siswaData = res.siswa;

                // Render Option Mapel
                const mapelSelect = document.getElementById("select-mapel");
                mapelSelect.innerHTML = res.mapel.map(m => `<option value="${m}">${m}</option>`).join("");

                // Trigger load nilai pertama
                loadNilai();
            }
        }

        async function loadNilai() {
            const mapel = document.getElementById("select-mapel").value;
            if (!mapel) return;

            const res = await apiCall({ action: "getNilai", rombel: currentSession.rombel, mapel });

            const scores = (res && res.success) ? res.nilai : {};
            renderTable(scores);
        }

        function renderTable(scores) {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";

            if (!siswaData || siswaData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-500">Tidak ada data siswa di rombel ini.</td></tr>`;
                return;
            }

            siswaData.forEach((siswa, index) => {
                const s = scores[siswa.id] || { tp1: 0, tp2: 0, tp3: 0, sts: 0, sas: 0 };

                const tr = document.createElement("tr");
                tr.className = "border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-3 text-sm">${index + 1}</td>
                    <td class="p-3 text-sm font-mono">${siswa.nisn}</td>
                    <td class="p-3 text-sm font-semibold">${siswa.nama}</td>
                    <td class="p-2"><input type="number" data-id="${siswa.id}" class="score-input tp1 w-16 border rounded text-center p-1" value="${s.tp1}" min="0" max="100" oninput="calcAvg(this)"></td>
                    <td class="p-2"><input type="number" data-id="${siswa.id}" class="score-input tp2 w-16 border rounded text-center p-1" value="${s.tp2}" min="0" max="100" oninput="calcAvg(this)"></td>
                    <td class="p-2"><input type="number" data-id="${siswa.id}" class="score-input tp3 w-16 border rounded text-center p-1" value="${s.tp3}" min="0" max="100" oninput="calcAvg(this)"></td>
                    <td class="p-2"><input type="number" data-id="${siswa.id}" class="score-input sts w-16 border rounded text-center p-1" value="${s.sts}" min="0" max="100" oninput="calcAvg(this)"></td>
                    <td class="p-2"><input type="number" data-id="${siswa.id}" class="score-input sas w-16 border rounded text-center p-1" value="${s.sas}" min="0" max="100" oninput="calcAvg(this)"></td>
                    <td class="p-3 text-center font-bold bg-blue-50 avg-cell">0</td>
                `;
                tbody.appendChild(tr);
                
                // Hitung Rata-Rata awal
                const lastRow = tbody.lastElementChild;
                calcAvg(lastRow.querySelector('.score-input'));
            });
        }

        // Kalkulasi Rata-Rata Otomatis Client-Side
        function calcAvg(element) {
            const tr = element.closest("tr");
            const tp1 = parseFloat(tr.querySelector(".tp1").value) || 0;
            const tp2 = parseFloat(tr.querySelector(".tp2").value) || 0;
            const tp3 = parseFloat(tr.querySelector(".tp3").value) || 0;
            const sts = parseFloat(tr.querySelector(".sts").value) || 0;
            const sas = parseFloat(tr.querySelector(".sas").value) || 0;

            const avg = (tp1 + tp2 + tp3 + sts + sas) / 5;
            tr.querySelector(".avg-cell").innerText = avg.toFixed(1);
        }

        // --- SIMPAN NILAI ---
        async function handleSaveNilai(e) {
            e.preventDefault();
            const mapel = document.getElementById("select-mapel").value;

            const payloadScores = [];
            const rows = document.querySelectorAll("#table-body tr");

            rows.forEach(tr => {
                const input = tr.querySelector(".score-input");
                if (input) {
                    const idSiswa = input.getAttribute("data-id");
                    payloadScores.push({
                        idSiswa: idSiswa,
                        tp1: tr.querySelector(".tp1").value,
                        tp2: tr.querySelector(".tp2").value,
                        tp3: tr.querySelector(".tp3").value,
                        sts: tr.querySelector(".sts").value,
                        sas: tr.querySelector(".sas").value
                    });
                }
            });

            const res = await apiCall({
                action: "saveNilai",
                rombel: currentSession.rombel,
                mapel: mapel,
                scores: payloadScores
            });

            if (res && res.success) {
                alert("Berhasil! " + res.message);
            } else if (res) {
                alert("Gagal menyimpan nilai!");
            }
        }
    </script>
</body>
</html>
